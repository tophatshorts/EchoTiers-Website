<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - EchoTiers</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(
135deg,
#f8fdff,
#eef9ff,
#dff4ff
);
color:#1f2937;
min-height:100vh;
display:flex;
flex-direction:column;
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:rgba(255,255,255,.75);
backdrop-filter:blur(15px);
position:sticky;
top:0;
z-index:1000;
border-bottom:1px solid rgba(0,0,0,.05);
}

.logo{
font-size:2rem;
font-weight:900;
color:#27a9ff;
text-decoration:none;
}

.logo span{
color:#0d5db8;
}

.nav-links{
display:flex;
gap:25px;
list-style:none;
}

.nav-links a{
text-decoration:none;
font-weight:600;
color:#4b5563;
transition:.2s;
}

.nav-links a:hover{
color:#27a9ff;
}

/* LOGIN CARD */

.login-wrap{
flex:1;
display:flex;
align-items:center;
justify-content:center;
padding:60px 20px;
}

.card{
background:white;
padding:50px 40px;
border-radius:24px;
box-shadow:0 10px 25px rgba(0,0,0,.05);
text-align:center;
max-width:420px;
width:100%;
}

.card h1{
font-size:2.5rem;
font-weight:900;
color:#27a9ff;
margin-bottom:10px;
}

.card p{
color:#64748b;
line-height:1.7;
margin-bottom:25px;
}

.google-btn{
display:flex;
align-items:center;
justify-content:center;
gap:12px;
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:white;
box-shadow:0 4px 14px rgba(0,0,0,.1);
font-size:1rem;
font-weight:700;
color:#4b5563;
cursor:pointer;
transition:.2s;
}

.google-btn:hover{
transform:translateY(-2px);
box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.google-btn:disabled{
opacity:.6;
cursor:wait;
transform:none;
}

.status{
margin-top:20px;
font-weight:600;
color:#27a9ff;
min-height:1.4em;
}

/* FOOTER */

footer{
background:white;
padding:30px 20px;
text-align:center;
}

footer p{
color:#64748b;
}

@media(max-width:800px){

nav{
flex-direction:column;
gap:20px;
}

.nav-links{
flex-wrap:wrap;
justify-content:center;
}

}

</style>
</head>

<body>

<nav>

<a href="home.html" class="logo">
Echo<span>Tiers</span>
</a>

<ul class="nav-links">
<li><a href="home.html">Home</a></li>
<li><a href="echotiers.html">EchoTiers</a></li>
<li><a href="members.html">Members</a></li>
<li><a href="history.html">History</a></li>
<li><a href="about.html">About</a></li>
</ul>

</nav>

<section class="login-wrap">

<div class="card">

<h1>Login/Sign Up</h1>

<p>
Sign in with Google to join the EchoTiers leaderboard. New players start at 100 ELO.
</p>

<button id="loginBtn" class="google-btn">

<svg width="20" height="20" viewBox="0 0 48 48">
<path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/>
<path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
<path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
<path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.2C36.9 40.4 44 35 44 24c0-1.3-.1-2.6-.4-3.9z"/>
</svg>

Sign in with Google

</button>

<p id="status" class="status"></p>

</div>

</section>

<footer>

<p>EchoTiers</p>

</footer>

<script type="module">

import { login } from "./players.js";

const btn =
document.getElementById("loginBtn");

const status =
document.getElementById("status");

btn.addEventListener("click", async () => {

btn.disabled = true;

status.textContent =
"Opening Google sign-in...";

const user = await login();

if(user){

status.textContent =
"Welcome, " + user.name + "! Redirecting...";

setTimeout(()=>{

window.location.href = "home.html";

},1200);

}else{

status.textContent =
"Login cancelled or failed. Try again.";

btn.disabled = false;

}

});

</script>

</body>
</html>
